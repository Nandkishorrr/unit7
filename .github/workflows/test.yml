# The checks, on every change to main and every pull request. A release runs them too (image.yml), and can't publish unless they pass.
name: test
on:
  push: { branches: [main] }
  pull_request:
  workflow_call:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
