# Unit7 on a small VPS of its own, on a different box from what it manages, so it never sleeps and it survives what it watches.
# Set UNIT7_MASTER_KEY once (openssl rand -base64 32) and keep it somewhere safe: without it, the vault can't be opened.
services:
  unit7:
    image: ghcr.io/nandkishorrr/unit7:latest
    restart: unless-stopped
    ports: ["127.0.0.1:4800:4800"] # put a proxy with HTTPS in front
    environment:
      UNIT7_MASTER_KEY: ${UNIT7_MASTER_KEY:?set it once, and keep it}
      UNIT7_URL: ${UNIT7_URL:-}
    volumes: ["unit7-data:/data"]
volumes:
  unit7-data:
